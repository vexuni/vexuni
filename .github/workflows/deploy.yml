name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/**
      - web/**
      - public/**
      - migrations/**
      - scripts/**
      - "wrangler*.jsonc"
      - package.json
      - package-lock.json
      - .github/workflows/deploy.yml

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix web ci

      - name: Build frontend, docs, and source archive
        run: npm run source

      - name: Resolve Cloudflare account
        run: |
          ACCOUNT_ID=$(curl -sf -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts" | jq -r '.result[0].id // empty')
          if [ -z "$ACCOUNT_ID" ]; then
            echo "::error::Could not resolve a Cloudflare account from CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"
          echo "Using account $ACCOUNT_ID"

      - name: Provision D1 database
        run: |
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          DB_ID=$(curl -sf -H "$AUTH" "$API/d1/database?name=vexuni" | jq -r '.result[0].uuid // empty')
          if [ -z "$DB_ID" ]; then
            DB_ID=$(curl -sf -X POST -H "$AUTH" -H "Content-Type: application/json" \
              -d '{"name":"vexuni"}' "$API/d1/database" | jq -r '.result.uuid // empty')
          fi
          if [ -z "$DB_ID" ]; then
            echo "::error::Could not provision D1 database 'vexuni'"
            exit 1
          fi
          node -e 'const fs=require("fs");const id=process.argv[1];for(const f of ["wrangler.jsonc","wrangler.apps.jsonc"]){fs.writeFileSync(f,fs.readFileSync(f,"utf8").replace(/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/g,m=>id))}' "$DB_ID"
          echo "D1 database_id: $DB_ID"

      - name: Provision R2 buckets and queue
        run: |
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl -sf -X PUT -H "$AUTH" "$API/r2/buckets/vexuni-objects" | jq -r '.success' || true
          curl -sf -X PUT -H "$AUTH" "$API/r2/buckets/vexuni-npm-cache" | jq -r '.success' || true
          Q=$(curl -sf -H "$AUTH" "$API/queues?name=vexuni-events" | jq -r '.result[0].queue_name // empty')
          if [ -z "$Q" ]; then
            curl -sf -X POST -H "$AUTH" -H "Content-Type: application/json" \
              -d '{"queue_name":"vexuni-events"}' "$API/queues" | jq -r '.success' || true
          fi

      - name: Apply D1 migrations
        run: yes | npx wrangler d1 migrations apply DB --remote

      - name: Upload worker secrets
        run: |
          echo "${{ secrets.BOOTSTRAP_SECRET }}" | npx wrangler secret put BOOTSTRAP_SECRET
          echo "${{ secrets.CREDENTIAL_ENCRYPTION_KEY }}" | npx wrangler secret put CREDENTIAL_ENCRYPTION_KEY

      - name: Deploy workers
        run: |
          npx wrangler deploy --config wrangler.build.jsonc
          npx wrangler deploy --config wrangler.apps.jsonc
          npx wrangler deploy

      - name: Attach custom domains
        run: |
          ZONE_ID=$(curl -sf -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones?name=vexuni.site" | jq -r '.result[0].id // empty')
          if [ -z "$ZONE_ID" ]; then
            echo "::warning::Zone vexuni.site is not in this Cloudflare account; workers are live on workers.dev only."
            exit 0
          fi
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          try_attach() {
            curl -s -o /tmp/dom.json -w "%{http_code}" -X PUT \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains" \
              -H "$AUTH" -H "Content-Type: application/json" \
              -d "{\"environment\":\"production\",\"hostname\":\"$1\",\"service\":\"$2\",\"zone_id\":\"$ZONE_ID\"}"
          }
          attach() {
            code=$(try_attach "$1" "$2")
            if [ "$code" = "409" ]; then
              echo "$1: clearing externally-managed DNS records"
              ZAPI="https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records"
              curl -s -H "$AUTH" "$ZAPI?name.exact=$1&per_page=100" \
                | jq -r '.result[] | "\(.type) \(.name) -> \(.content)"' || true
              for rid in $(curl -s -H "$AUTH" "$ZAPI?name.exact=$1&per_page=100" \
                | jq -r '.result[] | select(.type != "NS" and .type != "SOA" and .type != "DS" and .type != "DNSKEY") | .id'); do
                curl -s -X DELETE -H "$AUTH" "$ZAPI/$rid" | jq -r '"deleted: \(.success)"'
              done
              code=$(try_attach "$1" "$2")
            fi
            echo "$1 -> HTTP $code $(head -c 300 /tmp/dom.json)"
          }
          attach vexuni.site vexuni
          attach www.vexuni.site vexuni
          attach apps.vexuni.site vexuni-apps

      - name: Smoke test
        run: |
          sleep 15
          for url in "https://vexuni.site" "https://www.vexuni.site" "https://apps.vexuni.site" "https://vexuni.mzhub.workers.dev"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$url/" || echo 000)
            echo "$url -> $code"
          done
          echo "--- /api/bootstrap"
          curl -s --max-time 20 "https://vexuni.site/api/bootstrap" | head -c 400 || true
